<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>Trails</title>
    <style>
      /* Shell mínimo: portrait-first, sem scroll/zoom acidental e com safe-area. */
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        height: 100dvh;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        overflow: hidden;
        overscroll-behavior: none;
        background: #e7e2d8;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #stage {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
      }

      #game {
        display: block;
        background: #f4f1ea;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game" aria-label="Tabuleiro de Trails">Seu navegador não suporta Canvas 2D.</canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
